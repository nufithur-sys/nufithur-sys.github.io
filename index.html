<style>
:root{--bg:#f2f1f7;--navy:#1f1b4d;--g1:#8968f6;--g2:#0bb3cf}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--navy);padding:24px}
.card{width:100%;max-width:420px;text-align:center}
.logo{display:block;margin:0 auto;width:132px;height:132px;border-radius:30px;box-shadow:0 18px 40px rgba(31,27,77,.28)}
h1{display:inline-block;font-size:42px;margin:22px 0 6px;letter-spacing:-.5px;background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin:0 0 8px;font-size:18px;line-height:1.4}
.sub{opacity:.7;font-size:16px;margin-bottom:28px}
.btn{display:block;margin:0 auto 14px;padding:18px 22px;border-radius:999px;color:#fff;text-decoration:none;font-weight:700;font-size:19px;background:linear-gradient(90deg,var(--g1),var(--g2));box-shadow:0 12px 28px rgba(137,104,246,.35)}
.btn:active{transform:scale(.98)}
.pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 26px}
.pills span{background:#fff;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(31,27,77,.08)}
small{display:block;margin-top:26px;font-size:13px;opacity:.6}
small a{color:inherit}
